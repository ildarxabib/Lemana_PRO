<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Онлайн-клиентский опыт PRO</title>
<style>
/* Токены Lemana PRO Design System (assets/tokens.css), только используемые на странице.
   [Бренд] — брендбук, [Сайт] — снято с lemanapro.ru, [Г] — гипотеза. */
:root {
  --lm-yellow: #FDC300;
  --lm-graphite: #21282B;
  --lm-white: #FFFFFF;

  --lm-text: #21282B;
  --lm-text-secondary: #5A5E60;
  --lm-text-muted: #919395;          /* только теги и хлебные крошки */

  --lm-surface: #FFFFFF;
  --lm-surface-soft: #F5F4F1;
  --lm-surface-field: #E3E1D8;
  --lm-border: #E3E1D8;
  --lm-border-outline: #D7D3C8;

  --lm-font-main: 'LM Main', 'Segoe UI', Roboto, Arial, sans-serif;
  --lm-font-title: 'LM Title', 'LM Main', 'Segoe UI', Arial, sans-serif;

  --lm-r-sm: 4px;
  --lm-r-md: 8px;
  --lm-r-lg: 12px;
  --lm-r-pill: 999px;

  --lm-shadow-card: 0 2px 8px rgba(33, 40, 43, 0.12);   /* [Сайт] */
  --lm-shadow-hover: 0 6px 20px rgba(33, 40, 43, 0.16); /* [Г] */

  --lm-s-2: 8px; --lm-s-3: 12px; --lm-s-4: 16px;
  --lm-s-5: 24px; --lm-s-6: 32px; --lm-s-7: 48px; --lm-s-8: 64px;
}

/* Шрифты: файлы не подключены (лицензия не подтверждена). Если файлы есть, положите в fonts/ и раскомментируйте.
@font-face { font-family: 'LM Main'; font-weight: 400; src: url('fonts/LMMain-Regular.woff2') format('woff2'); }
@font-face { font-family: 'LM Main'; font-weight: 500; src: url('fonts/LMMain-Medium.woff2') format('woff2'); }
@font-face { font-family: 'LM Main'; font-weight: 600; src: url('fonts/LMMain-DemiBold.woff2') format('woff2'); }
@font-face { font-family: 'LM Main'; font-weight: 700; src: url('fonts/LMMain-Bold.woff2') format('woff2'); }
@font-face { font-family: 'LM Title'; font-weight: 400 900; src: url('fonts/LMTitle-VF.ttf') format('truetype'); }
*/

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--lm-surface);
  font-family: var(--lm-font-main);
  font-size: 18px;
  line-height: 1.5;
  color: var(--lm-text);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--lm-s-5) var(--lm-s-5) var(--lm-s-8);
}

/* ——— Верхняя строка с логотипом ——— */
.topbar {
  display: flex;
  align-items: center;
  margin-bottom: var(--lm-s-5);
}

.logo-slot {
  display: inline-flex;
  align-items: center;
  height: 54px;
  padding: 0 var(--lm-s-4);
  border: 1px dashed var(--lm-border-outline);
  border-radius: var(--lm-r-sm);
  font-size: 14px;
  color: var(--lm-text-secondary);
}

/* ——— Hero-баннер ——— */
.hero {
  background: var(--lm-yellow);
  border-radius: var(--lm-r-lg);
  padding: var(--lm-s-7) var(--lm-s-7) var(--lm-s-6);
  margin-bottom: var(--lm-s-7);
}

.hero h1 {
  font-family: var(--lm-font-title);
  text-transform: uppercase;
  font-weight: 700;
  font-size: 46px;
  line-height: 1;
  letter-spacing: 0;
  margin: 0 0 var(--lm-s-4);
  max-width: 760px;
  color: var(--lm-graphite);
}

.hero p {
  margin: 0;
  max-width: 640px;
  font-size: 18px;
  line-height: 1.5;
  color: var(--lm-graphite);
}

/* ——— Сетка плиток ——— */
.section-title {
  font-size: 22px;
  font-weight: 500;
  line-height: 1.15;
  margin: 0 0 var(--lm-s-5);
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--lm-s-5);
  align-items: stretch;
}

@media (max-width: 1080px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 820px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px)  {
  .grid { grid-template-columns: 1fr; }
  .page { padding: var(--lm-s-4) var(--lm-s-4) var(--lm-s-7); }
  .hero { padding: var(--lm-s-6) var(--lm-s-5) var(--lm-s-5); margin-bottom: var(--lm-s-6); }
  .hero h1 { font-size: 32px; }
}

/* ——— Плитка (карточка) ——— */
.tile {
  display: flex;
  flex-direction: column;
  min-height: 220px;
  padding: var(--lm-s-5);
  background: var(--lm-surface);
  border: 1px solid var(--lm-border);
  border-radius: var(--lm-r-md);
  box-shadow: var(--lm-shadow-card);
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}

.tile:hover {
  border-color: var(--lm-graphite);
  box-shadow: var(--lm-shadow-hover);
}

.tile:focus-visible {
  outline: 2px solid var(--lm-graphite);
  outline-offset: 2px;
}

.tile-icon {
  width: 54px;
  height: 54px;
  border-radius: var(--lm-r-sm);
  background: var(--lm-surface-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--lm-s-4);
  flex: none;
}

.tile-icon svg,
.arrow {
  fill: none;
  stroke: var(--lm-graphite);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tile-icon svg { width: 28px; height: 28px; }

.tile-title {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  margin: 0 0 var(--lm-s-2);
}

.tile-desc {
  font-size: 14px;
  line-height: 1.5;
  color: var(--lm-text-secondary);
  margin: 0 0 var(--lm-s-4);
}

.tile-footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: var(--lm-s-2);
}

.tag {
  display: inline-block;
  padding: 2px 10px;
  border: 1px solid var(--lm-border-outline);
  border-radius: var(--lm-r-pill);
  color: var(--lm-text-muted);
  font-size: 12px;
  line-height: 16px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.arrow {
  margin-left: auto;
  width: 22px;
  height: 22px;
  transition: transform 0.2s ease;
}

.tile:hover .arrow { transform: translateX(3px); }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <span class="logo-slot">логотип — подставить</span>
  </div>

  <header class="hero">
    <h1>Онлайн-клиентский опыт PRO</h1>
    <p>Рабочие материалы проекта Лемана ПРО</p>
  </header>

  <h2 class="section-title">Разделы</h2>

  <div class="grid">

    <!-- Process Mining -->
    <a class="tile" href="./process-mining/">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/></svg>
      </div>
      <h3 class="tile-title">Process Mining</h3>
      <p class="tile-desc">Анализ процессов по данным систем</p>
      <div class="tile-footer">
        <span class="tag">Процессы</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>

    <!--
      Шаблон новой плитки: скопируйте блок целиком, поменяйте href, иконку, название, описание и тег.
      Иконки: контурные, графитовые, viewBox 0 0 24 24, штрих 1.8 (стиль задаёт .tile-icon svg).

    <a class="tile" href="./section-name/">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">...</svg>
      </div>
      <h3 class="tile-title">Название</h3>
      <p class="tile-desc">Короткое описание</p>
      <div class="tile-footer">
        <span class="tag">Тег</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>
    -->

  </div>
</div>
</body>
</html>
